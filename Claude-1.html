function puff(){
 getGearPosition(tmp);
 const backDir = new THREE.Vector3();
 if(P.vel.lengthSq() > 1.0){
  backDir.copy(P.vel).normalize().negate();
 } else {
  const c = Math.cos(P.yaw), s = Math.sin(P.yaw);
  backDir.set(s, 0.2, c).normalize();

  const v = new THREE.Vector3(
   backDir.x * (6 + Math.random()*4) + (Math.random()-.5)*2,
   backDir.y * (4 + Math.random()*3) + Math.random()*2,
   backDir.z * (6 + Math.random()*4) + (Math.random()-.5)*2
  );
  steam.emit(tmp, v, 0.5, 2);
 }
}

function attach(w){

 let h=null;
 for(const hit of hits){
  let o=hit.object;
  if(GI.some(q=>o===q.G||o.parent===q.G)){h=hit;break;}
  if(P.roofB>=0){const rb=buildingList[P.roofB];if(rb.mesh===o||rb.roof===o||rb.chimney===o)continue;}
  let isDestroyedOrCollapsing=false;
  for(const b of buildingList){
   if((b.mesh===o || b.roof===o || b.chimney===o) && (b.destroyed || b.collapsing)){
    isDestroyedOrCollapsing=true;
    break;
   }
  }
  if(!isDestroyedOrCollapsing){
   h=hit;
   break;
  }
 }

 let nh=null;for(const q of GI){if(q.gs.dead)continue;const ns=ray.ray.intersectSphere(new THREE.Sphere(q.nape.getWorldPosition(new THREE.Vector3()),4),new THREE.Vector3());if(!ns)continue;const nd=ns.distanceTo(cam.position);if(nd<=CFG.range&&(!h||nd<=h.distance+4)&&(!nh||nd<nh.d))nh={q,d:nd};}

 puff();heard();return true;}
